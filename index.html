<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Guía de Despacho | Carflex</title>

<style>
:root {
    --primary: #ff7225;
    --primary-dark: #e65a15;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
    padding: 20px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('fondo formulario.jpg') center/cover no-repeat;
    filter: brightness(.55) blur(4px);
    z-index: -1;
}

.card {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,.98);
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    width: 145px;
    margin-bottom: 12px;
}

h2 {
    color: var(--text);
    font-size: 26px;
    margin-bottom: 6px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

.input-group span {
    display: block;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 2px solid var(--border);
    font-size: 15px;
    outline: none;
    background: white;
    font-family: 'Segoe UI', Roboto, sans-serif;
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(255,114,37,.1);
}

button[type="submit"] {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button[type="submit"]:hover { background: var(--primary-dark); }
button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; }

.msg {
    margin-top: 4px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
}

.error {
    background: #fef2f2;
    color: #b91c1c;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #fee2e2;
}

.success {
    background: #f0fdf4;
    color: #166534;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #dcfce7;
}

/* ── PANTALLA DE ÉXITO ── */
#success-screen {
    display: none;
    text-align: center;
    padding: 20px 10px 10px;
}

.success-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #dcfce7;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 36px;
}

#success-screen h3 {
    color: var(--text);
    font-size: 22px;
    margin-bottom: 8px;
}

#success-screen p {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 6px;
}

#success-screen .ot-label {
    display: inline-block;
    background: #fff7ed;
    color: var(--primary);
    border: 1.5px solid #ffcba4;
    border-radius: 8px;
    padding: 6px 18px;
    font-size: 15px;
    font-weight: 700;
    margin: 10px 0 24px;
}

#btn-volver {
    display: inline-block;
    padding: 14px 36px;
    border: none;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

#btn-volver:hover { background: #d1d5db; }
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <img src="Logo carflex.jpg" class="logo" alt="Carflex">
        <h2>Guía de Despacho</h2>
        <p class="subtitle">Ingrese el N° de traslado para generar la guía</p>
    </div>

    <!-- PANTALLA ÉXITO -->
    <div id="success-screen">
        <div class="success-icon">✅</div>
        <h3>¡Guía generada!</h3>
        <p>La guía de despacho fue generada correctamente.</p>
        <p style="color:var(--muted);font-size:13px;">N° Traslado</p>
        <div class="ot-label" id="success-traslado">—</div>
        <br>
        <button id="btn-volver">← Nueva solicitud</button>
    </div>

    <form id="form" class="form-grid">

        <div class="input-group">
            <span>N° de Traslado</span>
            <input id="traslado" type="text" placeholder="Ej: 32249" required autocomplete="off">
        </div>

        <button type="submit" id="btn-submit">
            Generar guía de despacho
        </button>

        <div id="msg" class="msg"></div>

    </form>

</div>

<script>
const WEBHOOK_URL = "https://shale-alarm-prodigy.ngrok-free.dev/webhook/guia-despacho";

// ── Botón volver ──
document.getElementById("btn-volver").addEventListener("click", () => {
    document.getElementById("success-screen").style.display = "none";
    document.getElementById("form").style.display = "grid";
    document.getElementById("msg").className = "msg";
    document.getElementById("msg").innerHTML = "";
});

// ── Envío del formulario ──
document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();

    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn-submit");

    const traslado = document.getElementById("traslado").value.trim();

    if (!traslado) {
        msg.className = "msg error";
        msg.innerHTML = "Debe ingresar el N° de traslado.";
        return;
    }

    msg.className = "msg";
    msg.innerHTML = "Generando guía, por favor espere...";
    btn.disabled = true;

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nro_traslado: traslado })
        });

        if (!response.ok) throw new Error();

        const data = await response.json();

        const trasladoEnviado = traslado;

        // Resetear formulario
        document.getElementById("form").reset();

        document.getElementById("success-traslado").textContent = trasladoEnviado;
        document.getElementById("form").style.display = "none";
        document.getElementById("success-screen").style.display = "block";

    } catch (err) {
        msg.className = "msg error";
        msg.innerHTML = "Error de conexión. Intente nuevamente.";
    }

    btn.disabled = false;
});
</script>

</body>
</html>
